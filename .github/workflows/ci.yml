name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Run linter (if available)
      run: npm run lint --if-present
      continue-on-error: true

    - name: Build shared library
      run: npx nx build shared-models

    - name: Test shared library
      run: npx nx test shared-models --coverage

    - name: Build API
      run: npx nx build customer-api

    - name: Test API
      run: npx nx test customer-api --coverage

    - name: Build UI
      run: npx nx build customer-ui

    - name: Test UI
      run: npx nx test customer-ui --watch=false --browsers=ChromeHeadless --code-coverage

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          coverage/
        retention-days: 30
